</a>

<script src="/site.js"></script>
<script>
(function () {
  const { CONFIG, T, getLang, wa, esc, applyText, langButtons, reveal } = KV;
  function render(lang) {
    const t = T[lang];
    document.documentElement.lang = lang;
    applyText(t);
    document.getElementById('discount').textContent = CONFIG.discount;
    document.querySelectorAll('.wa-hello').forEach((a) => a.href = wa(t.waHello));
    document.querySelectorAll('.cal-link').forEach((a) => a.href = CONFIG.calendly);
    document.querySelectorAll('.ig-link').forEach((a) => a.href = CONFIG.instagram);

    const mq = [t.m1, t.m2, t.m3, t.m4].map((m) => '<span>' + esc(m) + '</span><span>✦</span>').join('');
    document.getElementById('marquee').innerHTML = mq + mq + mq + mq;

    document.getElementById('services').innerHTML = t.services.map((s) => `
      <article class="kv-card kv-reveal" style="position:relative;background:#FFFAF6;border-radius:28px;padding:32px 28px;display:flex;flex-direction:column;gap:16px;box-shadow:0 20px 50px -30px rgba(90,40,50,.3);border:1px solid rgba(154,79,92,.12);min-height:420px">
        <div class="kv-icon serif" aria-hidden="true" style="width:72px;height:72px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(140deg,#F2C9CC,#E8A9B2);color:#2A1B1E;font-size:34px;font-style:italic;box-shadow:0 14px 30px -12px rgba(232,169,178,.9)">${s.num}</div>
        <h3 style="margin-top:8px;font-weight:600;font-size:32px;line-height:1.05">${esc(s.name)}</h3>
        <p style="margin:0;font-size:15px;line-height:1.65;color:#5B4A4D;flex-grow:1">${esc(s.desc)}</p>
        <div style="border-top:1px solid rgba(154,79,92,.18);padding-top:16px;display:flex;flex-direction:column;gap:6px">
          ${s.prices.map((p) => `<div style="display:flex;justify-content:space-between;gap:12px;font-size:14px"><span style="color:#5B4A4D">${esc(p[0])}</span><span style="font-weight:500;color:#7A3A47">${esc(p[1])}</span></div>`).join('')}
        </div>
        <a class="btn btn-wine-outline" href="/reservar?s=${s.id}">${esc(t.bookThis)}</a>
      </article>`).join('');

    document.getElementById('steps').innerHTML = t.steps.map((st) => `
      <div class="kv-reveal" style="padding:34px 28px;border-radius:28px;background:rgba(243,230,216,.05);border:1px solid rgba(243,230,216,.14)">
        <div class="serif" style="font-size:68px;line-height:1;font-style:italic;color:#F2C9CC">${st[0]}</div>
        <h3 style="margin:18px 0 10px;font-weight:600;font-size:27px">${esc(st[1])}</h3>
        <p style="margin:0;font-size:15px;line-height:1.7;color:#D9CBBB">${esc(st[2])}</p>
      </div>`).join('');

    const rv = [];
    for (let i = 0; i < 8; i++) rv.push(`
      <figure style="margin:0;width:340px;padding:30px 28px;border-radius:26px;background:#FFFAF6;border:1px solid rgba(154,79,92,.14);box-shadow:0 20px 40px -30px rgba(90,40,50,.35);display:flex;flex-direction:column;gap:16px">
        <div aria-hidden="true" class="serif" style="font-size:60px;line-height:.6;color:#E8A9B2">“</div>
        <blockquote class="serif" style="margin:0;font-size:22px;line-height:1.35;font-style:italic">${esc(t.revText)}</blockquote>
        <figcaption style="font-size:13px;letter-spacing:.14em;text-transform:uppercase;color:#7A3A47">${esc(t.revWho)} · ${esc(t.services[i % 4].name)}</figcaption>
      </figure>`);
    document.getElementById('reviews').innerHTML = rv.join('') + rv.join('');

    document.getElementById('faq').innerHTML = t.faq.map((f) => `
      <details class="kv-reveal" style="border-radius:22px;border:1px solid rgba(243,230,216,.16);background:rgba(243,230,216,.04);padding:0 24px">
        <summary class="serif" style="min-height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px;font-size:24px"><span>${esc(f[0])}</span><span class="kv-plus" aria-hidden="true" style="flex:none;width:32px;height:32px;border-radius:50%;background:#F2C9CC;color:#2A1B1E;display:flex;align-items:center;justify-content:center;font-family:'Jost',sans-serif;font-size:20px">+</span></summary>
        <p style="margin:0 0 22px;font-size:15px;line-height:1.7;color:#D9CBBB">${esc(f[1])}</p>
      </details>`).join('');

    const sel = document.getElementById('quick-svc');
    sel.innerHTML = '<option value="">' + esc(t.fPick) + '</option>' + t.services.map((s) => `<option value="${s.id}">${esc(s.name)}</option>`).join('');

    langButtons(lang, render);
    reveal();
  }
  document.getElementById('quick').addEventListener('submit', (e) => {
    e.preventDefault();
    const t = T[getLang()]; const f = e.target;
    const svc = t.services.find((s) => s.id === f.service.value);
    const lines = [t.waHello];
    if (f.name.value.trim()) lines.push(t.waName + ': ' + f.name.value.trim());
    if (svc) lines.push(t.waSvc + ': ' + svc.name);
    if (f.when.value.trim()) lines.push(t.waWhen + ': ' + f.when.value.trim());
    window.open(wa(lines.join('\n')), '_blank', 'noopener');
  });
  render(getLang());
})();
</script>
</body>
</html>
